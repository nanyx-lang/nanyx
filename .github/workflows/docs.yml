name: Docs

# Vercel's own Git deployments are off (`git.deploymentEnabled` in docs/vercel.json), so this
# workflow is the only thing that deploys the site. It builds on the runner and uploads the
# output with the Vercel CLI.
on:
  push:
    branches: [main]
    # Everything the site is built from. If the site starts reading files from another
    # directory outside docs/, add it here.
    paths:
      - "docs/**"
      - "extension/syntaxes/**"
      - "examples/**"
      - ".github/workflows/docs.yml"
  # Pull requests deploy nothing. `gh workflow run Docs --ref <branch>` deploys a branch as a
  # preview; on main it deploys to production.
  workflow_dispatch:

permissions:
  contents: read

# A newer commit's deployment replaces an older one, so there's no point finishing the older.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      PROD: ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install the Vercel CLI
        run: npm install --global vercel@65

      # The Vercel project's root directory is docs/, so the CLI runs from the repository root.
      - name: Pull the project settings
        run: vercel pull --yes --environment="$ENVIRONMENT" --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build $PROD --token="$VERCEL_TOKEN"

      - name: Deploy
        run: vercel deploy --prebuilt $PROD --token="$VERCEL_TOKEN" >> "$GITHUB_STEP_SUMMARY"
