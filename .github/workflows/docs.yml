name: Docs

on:
  # Deploys happen only when someone runs this workflow: `gh workflow run Docs`. Vercel's own Git
  # deployments are off (docs/vercel.json), so pushing deploys nothing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The same deploy as `vercel --prod` by hand: Vercel builds the site from the uploaded
      # repository, using the project's root directory (docs/).
      - name: Deploy to production
        run: npx --yes vercel@65.15.0 deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
