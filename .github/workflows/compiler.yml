name: Compiler

on:
  push:
    branches: [main]
    paths:
      - "compiler/**"
      - "!compiler/**/*.md"
      - "stdlib/**"
      - "packages/**"
      - "examples/**"
      # One of the tests formats the docs' code blocks.
      - "docs/src/content/**/*.md"
      - ".github/workflows/compiler.yml"
  # Pull requests run nothing: the tests take too long. Run them on your branch before you merge, locally or with
  # `gh workflow run Compiler --ref <branch>`.
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

defaults:
  run:
    working-directory: compiler

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Nyx.Compiler.slnx

      - name: Build
        run: dotnet build Nyx.Compiler.slnx --no-restore --configuration Release

      # Once is enough, and Linux checkouts keep the repository's line endings as they are.
      - name: Check the standard library and the shipped packages are formatted
        if: matrix.os == 'ubuntu-latest'
        run: dotnet run --project Nanyx.Compiler.Cli/NanyxCompiler.Cli.csproj --no-build --configuration Release -- format --check ../stdlib ../packages

      # AGENTS.md's limit for the compiler's F# and C# sources. Each file over it is a warning on the run, and the run
      # still passes.
      - name: List the source files over 1,500 lines
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "### Source files over 1,500 lines" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Lines |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          find . \( -name bin -o -name obj \) -prune -o \( -name '*.fs' -o -name '*.cs' \) -type f -print | sort | while read -r file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt 1500 ]; then
              path="compiler/${file#./}"
              echo "::warning file=$path::$path is $lines lines, over the 1,500-line limit in AGENTS.md"
              echo "| \`$path\` | $lines |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      # The Wasm tests run in the job below.
      - name: Test
        run: dotnet test Nyx.Compiler.slnx --no-build --configuration Release -p:SkipWasmTests=true

  # The Wasm tests take the longest by far (most of them compile and run a program), so they get a
  # runner to themselves rather than share its cores with the other test projects.
  wasm-test:
    name: Wasm tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PROJECT: Nanyx.Compiler.Wasm.Tests/Nanyx.Compiler.Wasm.Test.fsproj
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }}

      - name: Build
        run: dotnet build ${{ env.PROJECT }} --no-restore --configuration Release

      - name: Test
        run: dotnet test ${{ env.PROJECT }} --no-build --configuration Release

  # The playground host's runner, in headless Chromium: the compiler built for the browser compiles programs under the
  # playground host, and the runner runs them in a web worker (see compiler/Nanyx.Browser/playground-test.mjs). The
  # build it tested is the release's nanyx-browser.zip, which the docs site's playground runs
  # (docs/site/playground-compiler.mjs).
  browser-test:
    name: Browser test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish the compiler built for the browser
        run: dotnet publish Nanyx.Browser/Nanyx.Browser.csproj --configuration Release

      - name: Install Playwright and Chromium
        working-directory: compiler/Nanyx.Browser
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Test
        run: node Nanyx.Browser/playground-test.mjs

      # The published page, with the shipped packages and the playground host's runner, without the .br and .gz copies
      # the publish writes beside each file: the site that serves it compresses what it serves itself.
      - name: Package
        working-directory: compiler/Nanyx.Browser/bin/Release/net10.0/publish/wwwroot
        run: |
          mkdir -p "$GITHUB_WORKSPACE/compiler/dist"
          zip -qr "$GITHUB_WORKSPACE/compiler/dist/nanyx-browser.zip" . -x '*.br' -x '*.gz'
          unzip -l "$GITHUB_WORKSPACE/compiler/dist/nanyx-browser.zip" packages/nanyx.playground/runner/playground.js compiler.js _framework/dotnet.js

      - uses: actions/upload-artifact@v4
        with:
          name: nanyx-browser
          path: compiler/dist/nanyx-browser.zip
          if-no-files-found: error

  # Runs alongside the tests, not after them: only a release has to wait for both.
  publish:
    name: Publish (${{ matrix.rid }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read the compiler version
        id: version
        run: echo "version=$(dotnet msbuild Nanyx.Compiler.Cli/NanyxCompiler.Cli.csproj -getProperty:Version)" >> "$GITHUB_OUTPUT"

      # The release's notes are the version's section of the docs site's changelog, with its links made absolute so
      # they work on GitHub. Checked on every run, so a version bump without its write-up fails before it is merged
      # rather than at the release.
      - name: Take the release notes from the changelog
        if: matrix.rid == 'linux-x64'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANGELOG: ../docs/src/content/overview/changelog.md
        run: |
          mkdir -p notes
          awk -v heading="# $VERSION" '
            $0 == heading { found = 1; next }
            found && /^# / { exit }
            found { print }
          ' "$CHANGELOG" | sed -e 's|](\.\./|](https://nanyx.dev/docs/|g' -e '/./,$!d' > notes/release-notes.md
          if ! grep -q '[^[:space:]]' notes/release-notes.md; then
            echo "::error file=docs/src/content/overview/changelog.md::The changelog has no section for $VERSION. Add a '# $VERSION' section to docs/src/content/overview/changelog.md (see AGENTS.md)."
            exit 1
          fi
          cat notes/release-notes.md

      - uses: actions/upload-artifact@v4
        if: matrix.rid == 'linux-x64'
        with:
          name: release-notes
          path: compiler/notes/release-notes.md
          if-no-files-found: error

      # One self-contained, single-file executable per platform, so users need no .NET runtime.
      - name: Publish
        run: >
          dotnet publish Nanyx.Compiler.Cli/NanyxCompiler.Cli.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          --output publish/${{ matrix.rid }}

      # The CLI generates XML docs (Consolo builds its help text from them); they are not needed at runtime.
      - name: Remove files that are not part of the binary
        run: rm -f publish/${{ matrix.rid }}/*.xml

      # Also proves the embedded Wasmtime native library survives single-file publishing, and that the packages the
      # compiler ships (packages/, beside the binary) are where it finds them: a script and a new package both run
      # under the console host.
      - name: Smoke test the published binary
        if: matrix.rid == 'linux-x64'
        run: |
          chmod +x publish/linux-x64/nanyx
          ./publish/linux-x64/nanyx --help
          printf 'println("Hello, Nanyx!")\n' > hello.nyx
          output="$(./publish/linux-x64/nanyx run hello.nyx)"
          echo "$output"
          [ "$output" = "Hello, Nanyx!" ]
          ./publish/linux-x64/nanyx new acme.smoke smoke
          output="$(./publish/linux-x64/nanyx run smoke)"
          echo "$output"
          [ "$output" = "Hello, World!" ]

      - name: Package
        id: package
        run: |
          name="nanyx-${{ steps.version.outputs.version }}-${{ matrix.rid }}"
          mkdir -p dist
          case "${{ matrix.rid }}" in
            win-*)
              (cd publish/${{ matrix.rid }} && zip -r "../../dist/$name.zip" .)
              echo "file=compiler/dist/$name.zip" >> "$GITHUB_OUTPUT"
              ;;
            *)
              chmod +x publish/${{ matrix.rid }}/nanyx
              tar -czf "dist/$name.tar.gz" -C publish/${{ matrix.rid }} .
              echo "file=compiler/dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: nanyx-${{ matrix.rid }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

  # Merging a version bump is the release: main publishes the binaries it just built and tested
  # as compiler/<version>, with the browser build, nanyx-browser.zip, unless that tag already exists. Nothing is rebuilt
  # for a release.
  release:
    name: Release
    needs: [test, wasm-test, browser-test, publish]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Queue rather than race, so a second push of the same version sees the first one's tag.
    concurrency:
      group: compiler-release
      cancel-in-progress: false
    env:
      TAG: compiler/${{ needs.publish.outputs.version }}
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check whether this version is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" --silent 2>/dev/null; then
            echo "$TAG already exists; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.check.outputs.release == 'true'
        with:
          pattern: nanyx-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        if: steps.check.outputs.release == 'true'
        with:
          name: release-notes
          path: notes

      - name: Tag the commit and attach the binaries to a GitHub release
        if: steps.check.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Compiler ${{ needs.publish.outputs.version }}
          files: dist/*
          body_path: notes/release-notes.md
