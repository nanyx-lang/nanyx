name: Compiler

on:
  push:
    branches: [main]
    paths:
      - "compiler/**"
      - "!compiler/**/*.md"
      - "stdlib/**"
      - "examples/**"
      # One of the tests formats the docs' code blocks.
      - "docs/src/content/**/*.md"
      - ".github/workflows/compiler.yml"
  # Pull requests run nothing: the tests take too long. Run them on your branch before you merge, locally or with
  # `gh workflow run Compiler --ref <branch>`.
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

defaults:
  run:
    working-directory: compiler

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Nyx.Compiler.slnx

      - name: Build
        run: dotnet build Nyx.Compiler.slnx --no-restore --configuration Release

      # Once is enough, and Linux checkouts keep the repository's line endings as they are.
      - name: Check the standard library is formatted
        if: matrix.os == 'ubuntu-latest'
        run: dotnet run --project Nanyx.Compiler.Cli/NanyxCompiler.Cli.csproj --no-build --configuration Release -- format --check ../stdlib

      # The Wasm tests run in the job below.
      - name: Test
        run: dotnet test Nyx.Compiler.slnx --no-build --configuration Release -p:SkipWasmTests=true

  # The Wasm tests take the longest by far (most of them compile and run a program), so they get a
  # runner to themselves rather than share its cores with the other test projects.
  wasm-test:
    name: Wasm tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PROJECT: Nanyx.Compiler.Wasm.Tests/Nanyx.Compiler.Wasm.Test.fsproj
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }}

      - name: Build
        run: dotnet build ${{ env.PROJECT }} --no-restore --configuration Release

      - name: Test
        run: dotnet test ${{ env.PROJECT }} --no-build --configuration Release

  # Runs alongside the tests, not after them: only a release has to wait for both.
  publish:
    name: Publish (${{ matrix.rid }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read the compiler version
        id: version
        run: echo "version=$(dotnet msbuild Nanyx.Compiler.Cli/NanyxCompiler.Cli.csproj -getProperty:Version)" >> "$GITHUB_OUTPUT"

      # One self-contained, single-file executable per platform, so users need no .NET runtime.
      - name: Publish
        run: >
          dotnet publish Nanyx.Compiler.Cli/NanyxCompiler.Cli.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          --output publish/${{ matrix.rid }}

      # The CLI generates XML docs (Consolo builds its help text from them); they are not needed at runtime.
      - name: Remove files that are not part of the binary
        run: rm -f publish/${{ matrix.rid }}/*.xml

      # Also proves the embedded Wasmtime native library survives single-file publishing.
      - name: Smoke test the published binary
        if: matrix.rid == 'linux-x64'
        run: |
          chmod +x publish/linux-x64/nanyx
          ./publish/linux-x64/nanyx --help
          printf 'import nanyx/console\n\nprintln("Hello, Nanyx!")\n' > hello.nyx
          output="$(./publish/linux-x64/nanyx run hello.nyx)"
          echo "$output"
          [ "$output" = "Hello, Nanyx!" ]

      - name: Package
        id: package
        run: |
          name="nanyx-${{ steps.version.outputs.version }}-${{ matrix.rid }}"
          mkdir -p dist
          case "${{ matrix.rid }}" in
            win-*)
              (cd publish/${{ matrix.rid }} && zip -r "../../dist/$name.zip" .)
              echo "file=compiler/dist/$name.zip" >> "$GITHUB_OUTPUT"
              ;;
            *)
              chmod +x publish/${{ matrix.rid }}/nanyx
              tar -czf "dist/$name.tar.gz" -C publish/${{ matrix.rid }} .
              echo "file=compiler/dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: nanyx-${{ matrix.rid }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

  # Merging a version bump is the release: main publishes the binaries it just built and tested
  # as compiler/<version>, unless that tag already exists. Nothing is rebuilt for a release.
  release:
    name: Release
    needs: [test, wasm-test, publish]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Queue rather than race, so a second push of the same version sees the first one's tag.
    concurrency:
      group: compiler-release
      cancel-in-progress: false
    env:
      TAG: compiler/${{ needs.publish.outputs.version }}
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check whether this version is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" --silent 2>/dev/null; then
            echo "$TAG already exists; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.check.outputs.release == 'true'
        with:
          pattern: nanyx-*
          path: dist
          merge-multiple: true

      - name: Tag the commit and attach the binaries to a GitHub release
        if: steps.check.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Compiler ${{ needs.publish.outputs.version }}
          files: dist/*
          generate_release_notes: true
