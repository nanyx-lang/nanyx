name: Compiler

on:
  push:
    branches: [main]
    paths:
      - "compiler/**"
      - "!compiler/**/*.md"
      - "stdlib/**"
      - "packages/**"
      - "examples/**"
      # One of the tests formats the docs' code blocks.
      - "docs/src/content/**/*.md"
      # The Browser test job tests the playground page with the compiler it publishes.
      - "docs/src/pages/playground.astro"
      - "docs/src/lib/playground/**"
      - "docs/site/playground-*.mjs"
      - ".github/workflows/compiler.yml"
  # Pull requests run nothing: the tests take too long. Run them on your branch before you merge, locally or with
  # `gh workflow run Compiler --ref <branch>`.
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

defaults:
  run:
    working-directory: compiler

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Nyx.Compiler.slnx

      - name: Build
        run: dotnet build Nyx.Compiler.slnx --no-restore --configuration Release

      # The componentizer's .wasm is committed (see Nanyx.Compiler.Runtime.fsproj): a change to its crate must come with
      # the rebuilt .wasm and the new hash of its sources.
      - name: Check the committed componentizer was built from its sources
        if: matrix.os == 'ubuntu-latest'
        working-directory: .
        run: |
          expected=$(cat compiler/Nanyx.Componentizer/nanyx-componentizer.wasm.sources)
          actual=$(.github/scripts/componentizer-sources.sh)
          if [ "$expected" != "$actual" ]; then
            echo "::error::compiler/Nanyx.Componentizer changed: rebuild nanyx-componentizer.wasm with 'dotnet build -p:BuildComponentizer=true' and run .github/scripts/componentizer-sources.sh --write"
            exit 1
          fi

      # Once is enough, and Linux checkouts keep the repository's line endings as they are.
      - name: Check the standard library and the shipped packages are formatted
        if: matrix.os == 'ubuntu-latest'
        run: dotnet run --project Nanyx.Compiler.Cli/NanyxCompiler.Cli.csproj --no-build --configuration Release -- format --check ../stdlib ../packages

      # AGENTS.md's limit for the compiler's F# and C# sources. Each file over it is a warning on the run, and the run
      # still passes.
      - name: List the source files over 1,500 lines
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "### Source files over 1,500 lines" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Lines |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          find . \( -name bin -o -name obj \) -prune -o \( -name '*.fs' -o -name '*.cs' \) -type f -print | sort | while read -r file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt 1500 ]; then
              path="compiler/${file#./}"
              echo "::warning file=$path::$path is $lines lines, over the 1,500-line limit in AGENTS.md"
              echo "| \`$path\` | $lines |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      # The Wasm tests run in the job below, and the timing tests in the Timing workflow.
      - name: Test
        run: dotnet test Nyx.Compiler.slnx --no-build --configuration Release -p:SkipWasmTests=true --filter "Category!=Timing"

      # A WASI 0.3 component must run outside nanyx too: each example package is built as one and run under Wasmtime,
      # which must print what nanyx run does (see docs/src/content/deep-dives/components.md).
      - name: Install Wasmtime
        if: matrix.os == 'ubuntu-latest'
        run: |
          curl -sSfL https://github.com/bytecodealliance/wasmtime/releases/download/v51.0.0/wasmtime-v51.0.0-x86_64-linux.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasmtime-v51.0.0-x86_64-linux" >> "$GITHUB_PATH"

      - name: Run the example packages as components under Wasmtime
        if: matrix.os == 'ubuntu-latest'
        run: |
          project="$PWD/Nanyx.Compiler.Cli/NanyxCompiler.Cli.csproj"
          nanyx() { dotnet run --project "$project" --no-build --configuration Release -- "$@"; }
          for manifest in ../examples/*/*.nyxp; do
            # A package under the HTTP host serves rather than prints: the next step checks it.
            if grep -q '"nanyx.http.host"' "$manifest"; then continue; fi
            package=$(dirname "$manifest")
            component="$RUNNER_TEMP/$(basename "$package").wasm"
            nanyx build "$package" --out "$component"
            expected=$(cd "$package" && nanyx run < /dev/null)
            actual=$(wasmtime run "$component" < /dev/null)
            if [ "$expected" != "$actual" ]; then
              echo "::error::$package prints something else under wasmtime run"
              diff <(echo "$expected") <(echo "$actual")
              exit 1
            fi
          done

      # A package under the HTTP host is built as a component of wasi:http/service, which wasmtime serve serves. Its
      # instances are reused, so the requests in turn are answered by one instance, which runs the program afresh for each.
      - name: Serve the example HTTP package as a component under Wasmtime
        if: matrix.os == 'ubuntu-latest'
        run: |
          project="$PWD/Nanyx.Compiler.Cli/NanyxCompiler.Cli.csproj"
          component="$RUNNER_TEMP/hello.server.wasm"
          dotnet run --project "$project" --no-build --configuration Release -- build ../examples/hello.server --out "$component"
          wasmtime serve -Scli --addr 127.0.0.1:8080 "$component" &
          server=$!
          trap 'kill $server' EXIT
          for attempt in $(seq 1 50); do curl -s -o /dev/null http://127.0.0.1:8080/ && break; sleep 0.2; done
          check() {
            if [ "$1" != "$2" ]; then
              echo "::error::hello.server answers '$1' rather than '$2' under wasmtime serve"
              exit 1
            fi
          }
          check "$(curl -s http://127.0.0.1:8080/)" "Welcome!"
          check "$(curl -s http://127.0.0.1:8080/hello/ada)" "Hello, ada!"
          check "$(curl -s http://127.0.0.1:8080/hello/grace)" "Hello, grace!"
          check "$(curl -s --data-binary 'some text' http://127.0.0.1:8080/echo)" "some text"
          # The handler races a 20 ms sleep against a minute's: it answers in time only if handle returns to the host
          # while both wait, and the loser's sleep is cancelled when the winner wakes.
          check "$(curl -s --max-time 10 http://127.0.0.1:8080/race)" "the hare wins"
          check "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/nowhere)" "404"
          check "$(curl -s -o /dev/null -w '%{http_code}' -X TRACE http://127.0.0.1:8080/)" "400"

      # A Nanyx component and Rust components call each other: a Rust command calls the Nanyx component's exports,
      # which call a Rust component's, composed with wac and run under Wasmtime (see ComponentInterop/run.sh).
      # wac's own build of its release, checked against its SHA-256, rather than compiled from source with
      # `cargo install`, which took over two minutes (#2405).
      - name: Install wac and Rust's wasm32-wasip2 target
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add wasm32-wasip2
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/wac" \
            https://github.com/bytecodealliance/wac/releases/download/v0.12.0/wac-cli-x86_64-unknown-linux-musl
          echo "7cd490edbd452221ef89e6750fc43eacc9b71b1242095eb577cb9a3bf0d3beda  $RUNNER_TEMP/wac" | sha256sum --check --strict
          install -m 755 "$RUNNER_TEMP/wac" "$HOME/.cargo/bin/wac"
          wac --version

      # The Rust crates the interop test builds, and what Cargo downloads for them, kept between runs.
      - name: Cache the interop crates' dependencies and builds
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            compiler/ComponentInterop/units/target
            compiler/ComponentInterop/app/target
          key: interop-${{ runner.os }}-${{ hashFiles('compiler/ComponentInterop/*/Cargo.lock') }}

      - name: Call between a Nanyx component and Rust components under Wasmtime
        if: matrix.os == 'ubuntu-latest'
        run: ComponentInterop/run.sh "$RUNNER_TEMP/interop"

  # The Wasm tests take the longest by far (most of them compile and run a program), so they get runners to themselves
  # rather than share their cores with the other test projects: 3 shards per OS, each with some of the test project's
  # areas, its directories under Features/ and E2E. .github/scripts/wasm-shards.py says which shard each area is in: to
  # add a directory, add its name to a shard there. Each shard first checks that every test is in exactly one shard.
  wasm-test:
    name: Wasm tests (${{ matrix.os }}, shard ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2, 3]
    env:
      PROJECT: Nanyx.Compiler.Wasm.Tests/Nanyx.Compiler.Wasm.Test.fsproj
      SHARDS: ${{ matrix.os == 'windows-latest' && 'python' || 'python3' }} ../.github/scripts/wasm-shards.py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }}

      - name: Build
        run: dotnet build ${{ env.PROJECT }} --no-restore --configuration Release

      - name: Check that every test is in exactly one shard
        shell: bash
        run: dotnet test ${{ env.PROJECT }} --no-build --configuration Release --list-tests | $SHARDS check

      # The shard's areas, but for the timing tests, which run in the Timing workflow.
      - name: Test
        shell: bash
        run: dotnet test ${{ env.PROJECT }} --no-build --configuration Release --filter "$($SHARDS filter ${{ matrix.shard }})"

  # The playground host's runner, in headless Chromium: the compiler built for the browser compiles programs under the
  # playground host, and the runner runs them in a web worker (see compiler/Nanyx.Browser/playground-test.mjs). Then
  # the docs site, built with that compiler, and its playground page (docs/site/playground-test.mjs). The build it
  # tested is the release's nanyx-browser.zip, which the docs site's playground runs (docs/site/playground-compiler.mjs).
  browser-test:
    name: Browser test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # Without the .br and .gz copies of each file a publish writes by default, which nothing here reads: the zip leaves
      # them out, and the site that serves it compresses what it serves itself (#2554).
      - name: Publish the compiler built for the browser
        run: dotnet publish Nanyx.Browser/Nanyx.Browser.csproj --configuration Release -p:CompressionEnabled=false

      - name: Install Playwright and Chromium
        working-directory: compiler/Nanyx.Browser
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Test
        run: node Nanyx.Browser/playground-test.mjs

      # The published page, with the shipped packages and the playground host's runner. The publish writes no .br or .gz
      # copies, which the zip would leave out anyway.
      - name: Package
        working-directory: compiler/Nanyx.Browser/bin/Release/net10.0/publish/wwwroot
        run: |
          mkdir -p "$GITHUB_WORKSPACE/compiler/dist"
          zip -qr "$GITHUB_WORKSPACE/compiler/dist/nanyx-browser.zip" . -x '*.br' -x '*.gz'
          unzip -l "$GITHUB_WORKSPACE/compiler/dist/nanyx-browser.zip" packages/nanyx.playground.host/runner/playground.js compiler.js _framework/dotnet.js

      - name: Test the playground page
        working-directory: docs
        env:
          NANYX_BROWSER_ZIP: ${{ github.workspace }}/compiler/dist/nanyx-browser.zip
        run: |
          npm ci
          npm install --no-save playwright@1.49.1
          npm run build
          node site/playground-test.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: nanyx-browser
          path: compiler/dist/nanyx-browser.zip
          if-no-files-found: error

  # The compiler's version, and whether it is new: a version with no compiler/<version> tag yet. A push to main with a new
  # version releases it, and a branch run with one is a release PR's. The release's notes are the version's section of
  # the docs site's changelog, with its links made absolute so they work on GitHub. They are checked whenever the
  # version is new, so a version bump without its write-up fails before it is merged rather than at the release.
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the compiler version, and whether it is released
        id: version
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/compiler/$version" > /dev/null || status=$?
          case $status in
            0) echo "compiler/$version is released."; echo "new=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "compiler/$version is not released yet."; echo "new=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Could not read the tags (git ls-remote exited with $status)"; exit 1 ;;
          esac

      - name: Take the release notes from the changelog
        if: steps.version.outputs.new == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANGELOG: ../docs/src/content/overview/changelog.md
        run: |
          mkdir -p notes
          awk -v heading="# $VERSION" '
            $0 == heading { found = 1; next }
            found && /^# / { exit }
            found { print }
          ' "$CHANGELOG" | sed -e 's|](\.\./|](https://nanyx.dev/docs/|g' -e '/./,$!d' > notes/release-notes.md
          if ! grep -q '[^[:space:]]' notes/release-notes.md; then
            echo "::error file=docs/src/content/overview/changelog.md::The changelog has no section for $VERSION. Add a '# $VERSION' section to docs/src/content/overview/changelog.md (see AGENTS.md)."
            exit 1
          fi
          cat notes/release-notes.md

      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.new == 'true'
        with:
          name: release-notes
          path: compiler/notes/release-notes.md
          if-no-files-found: error

  # The release's binaries, one per platform: on a push to main, which releases a new version, and on a branch run only
  # with a new version, a release PR's, so that what the release would fail on fails before it is merged.
  # Runs alongside the tests, not after them: only a release has to wait for both.
  publish:
    name: Publish (${{ matrix.rid }})
    needs: version
    if: github.event_name == 'push' || needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # One self-contained, single-file executable per platform, so users need no .NET runtime.
      - name: Publish
        run: >
          dotnet publish Nanyx.Compiler.Cli/NanyxCompiler.Cli.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          --output publish/${{ matrix.rid }}

      # The CLI generates XML docs (Consolo builds its help text from them); they are not needed at runtime.
      - name: Remove files that are not part of the binary
        run: rm -f publish/${{ matrix.rid }}/*.xml

      # Also proves the embedded Wasmtime native library survives single-file publishing, and that the packages the
      # compiler ships (packages/, beside the binary) are where it finds them: a script and a new package both run
      # under the console host.
      - name: Smoke test the published binary
        if: matrix.rid == 'linux-x64'
        run: |
          chmod +x publish/linux-x64/nanyx
          ./publish/linux-x64/nanyx --help
          printf 'println("Hello, Nanyx!")\n' > hello.nyx
          output="$(./publish/linux-x64/nanyx run hello.nyx)"
          echo "$output"
          [ "$output" = "Hello, Nanyx!" ]
          ./publish/linux-x64/nanyx new acme.smoke smoke
          output="$(./publish/linux-x64/nanyx run smoke)"
          echo "$output"
          [ "$output" = "Hello, World!" ]

      # The packages the compiler ships, each packed as the release publishes it to the package index: the release
      # carries <name>-<version>.nyxpkg beside the binaries, and the index's sync records it from there, as it does any
      # package's release. Packed by the binary just built, so a package it can't pack, or a manifest whose version isn't
      # the compiler's, fails the job before anything is released.
      - name: Pack the shipped packages
        if: matrix.rid == 'linux-x64'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist/packages
          for package in ../packages/*/; do
            ./publish/linux-x64/nanyx pack --out dist/packages "$package"
          done
          expected=$(find ../packages -mindepth 1 -maxdepth 1 -type d | wc -l)
          packed=$(find dist/packages -name "*-$VERSION.nyxpkg" | wc -l)
          if [ "$packed" != "$expected" ]; then
            echo "::error::Packed $packed packages at $VERSION, but packages/ holds $expected: each shipped manifest's version must be the compiler's"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: matrix.rid == 'linux-x64'
        with:
          name: nanyx-packages
          path: compiler/dist/packages/*.nyxpkg
          if-no-files-found: error

      - name: Package
        id: package
        run: |
          name="nanyx-${{ needs.version.outputs.version }}-${{ matrix.rid }}"
          mkdir -p dist
          case "${{ matrix.rid }}" in
            win-*)
              (cd publish/${{ matrix.rid }} && zip -r "../../dist/$name.zip" .)
              echo "file=compiler/dist/$name.zip" >> "$GITHUB_OUTPUT"
              ;;
            *)
              chmod +x publish/${{ matrix.rid }}/nanyx
              tar -czf "dist/$name.tar.gz" -C publish/${{ matrix.rid }} .
              echo "file=compiler/dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: nanyx-${{ matrix.rid }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

  # Merging a version bump is the release: main publishes the binaries it just built and tested
  # as compiler/<version>, with the browser build, nanyx-browser.zip, and the shipped packages' .nyxpkg files, which the
  # package index's sync records from the release, unless that tag already exists. Nothing is rebuilt for a release.
  release:
    name: Release
    needs: [test, wasm-test, browser-test, version, publish]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Queue rather than race, so a second push of the same version sees the first one's tag.
    concurrency:
      group: compiler-release
      cancel-in-progress: false
    env:
      TAG: compiler/${{ needs.version.outputs.version }}
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check whether this version is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" --silent 2>/dev/null; then
            echo "$TAG already exists; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.check.outputs.release == 'true'
        with:
          pattern: nanyx-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        if: steps.check.outputs.release == 'true'
        with:
          name: release-notes
          path: notes

      - name: Tag the commit and attach the binaries and the shipped packages to a GitHub release
        if: steps.check.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Compiler ${{ needs.version.outputs.version }}
          files: dist/*
          body_path: notes/release-notes.md
